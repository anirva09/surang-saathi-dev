[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surang-saathi-api"
version = "0.1.0"
description = "Surang Saathi SIH backend modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "geoalchemy2>=0.16,<1.0",
  "alembic>=1.14,<2.0",
  "minio>=7.2,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
